name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Prepare Flutter project and build APK
        run: |
          cp lib/main.dart /tmp/main_backup.dart
          cp icon.jpg /tmp/icon_backup.jpg
          rm -rf lib
          flutter create --org ru.primorye --project-name primorye_app .
          flutter pub add http flutter_launcher_icons
          cp /tmp/icon_backup.jpg icon.jpg
          python3 -c '
          s = open("/tmp/main_backup.dart").read()
          s = s.replace("import '\''dart:html'\'' as html;", "import '\''package:http/http.dart'\'' as http;")
          s = s.replace("html.HttpRequest.request(", "_mobileHttp(")
          helper = """
          class _FakeResp { final int status; final String? responseText; _FakeResp(this.status, this.responseText); }
          Future<_FakeResp> _mobileHttp(String url, {String method = '\''GET'\'', Map<String, String>? requestHeaders, String? sendData}) async {
            final uri = Uri.parse(url);
            http.Response r;
            if (method == '\''POST'\'') r = await http.post(uri, headers: requestHeaders, body: sendData);
            else if (method == '\''PATCH'\'') r = await http.patch(uri, headers: requestHeaders, body: sendData);
            else r = await http.get(uri, headers: requestHeaders);
            return _FakeResp(r.statusCode, r.body);
          }
          """
          open("lib/main.dart", "w").write(s + helper)
          manifest = open("android/app/src/main/AndroidManifest.xml").read()
          manifest = manifest.replace("android:label=\"primorye_app\"", "android:label=\"Работа Тут\"")
          open("android/app/src/main/AndroidManifest.xml", "w").write(manifest)
          open("flutter_launcher_icons.yaml", "w").write("flutter_launcher_icons:\n  android: true\n  image_path: \"icon.jpg\"\n")
          '
          dart run flutter_launcher_icons
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: Primorye-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
