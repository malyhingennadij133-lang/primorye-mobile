name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Prepare Flutter project and build APK
        run: |
          cp lib/main.dart /tmp/main_backup.dart
          rm -rf lib
          flutter create --org ru.primorye --project-name primorye_app .
          sed -i "s|import 'dart:html' as html;||g" /tmp/main_backup.dart
          cp /tmp/main_backup.dart lib/main.dart
          flutter pub get
          flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Primorye-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
